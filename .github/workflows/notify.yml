name: Notify
on:
  issues:
    types: [opened, reopened, closed]
jobs:
  notify:
    name: Notify
    if: ${{ contains(github.event.issue.title, '🛑') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Feishu Official
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          webhook_url='${{ secrets.FEISHU_WEBHOOK_URL }}'
          if [ -z "$webhook_url" ]; then
            echo "::error::FEISHU_WEBHOOK_URL secret is required for feishu official webhook"
            exit 1
          fi

          issue_title="$ISSUE_TITLE"
          if [ "$ISSUE_STATE" = "closed" ]; then
            issue_title="${issue_title/🛑/🆗}"
            issue_title="${issue_title/down/up}"
          fi

          timestamp="$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M:%S%:z')"
          payload=$(jq -n \
            --arg title "Upptime 通知" \
            --arg issue_title "$issue_title" \
            --arg issue_link "#$ISSUE_NUMBER" \
            --arg issue_url "$ISSUE_URL" \
            --arg timestamp "$timestamp" \
            '{
              msg_type: "post",
              content: {
                post: {
                  zh_cn: {
                    title: $title,
                    content: [
                      [{tag: "text", text: ""}],
                      [
                        {tag: "text", text: $issue_title},
                        {tag: "text", text: " "},
                        {tag: "a", text: $issue_link, href: $issue_url},
                        {tag: "text", text: (" at " + $timestamp)}
                      ]
                    ]
                  }
                }
              }
            }')

          response=$(curl --max-time 15 -fsS -d "$payload" -H 'Content-Type: application/json' -X 'POST' "$webhook_url" || true)
          if [ -z "$response" ]; then
            echo "::error::Feishu official webhook returned empty response"
            exit 1
          fi
          code=$(echo "$response" | jq -r '.code // -1' 2>/dev/null)
          if [ "$code" != "0" ]; then
            echo "::error::Feishu official webhook failed: $(echo "$response" | jq -c . 2>/dev/null || echo "$response")"
            exit 1
          fi
          echo "status notified"
